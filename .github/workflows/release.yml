name: Release

on:
  push:
    tags: ["java-v*"]

permissions:
  contents: write

jobs:
  publish:
    name: Publish Java SDK to Maven Central
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: java
      - name: Derive version from tag
        run: echo "SDK_VERSION=${GITHUB_REF_NAME#java-v}" >> "$GITHUB_ENV"
      - run: ./gradlew build --no-daemon -PsdkVersion="$SDK_VERSION"
      - run: ./gradlew publishAndReleaseToMavenCentral --no-daemon --no-configuration-cache -PsdkVersion="$SDK_VERSION"
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_TOKEN_CENTRAL_REPOSITORY_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_TOKEN_CENTRAL_REPOSITORY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSWORD }}
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            java/sdk/build/libs/*.jar
            java/flights-cfar-client/build/libs/*.jar
            java/spreedly-client/build/libs/*.jar
