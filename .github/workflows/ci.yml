name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: java
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "java/**/build/test-results/test/*.xml"
          if-no-files-found: ignore

  generated-code-in-sync:
    name: Generated code matches spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: java/generate.sh
      - name: Fail if regeneration changed anything
        run: |
          if ! git diff --quiet; then
            git status --short
            echo "::error::Generated sources are out of date. Run java/generate.sh and commit the result."
            exit 1
          fi

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if a .env file is tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::A .env file is committed. Only .env.example belongs in the repo."
            exit 1
          fi
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown
